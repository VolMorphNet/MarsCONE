name: marscone
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - gdal
  - geopandas
  - rasterio
  - fiona
  - pyproj
  - shapely
  - pandas
  - numpy
  - matplotlib
  - tqdm
  - scikit-image
  - jupyter
  - pip
  - pip:
    - nbconvert
    - pytest
    - pytest-cov
    - pylint
    - black
    - isort
    - flake8
